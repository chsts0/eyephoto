name: release

# Сборка установщика под Windows и публикация релиза.
# Срабатывает на каждый пуш в main, но собирает только если версии
# из package.json ещё нет в релизах. То есть обновление для всех компов =
# поднять version в package.json и влить в main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      created: ${{ steps.ver.outputs.exists == 'false' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, вышла ли уже эта версия
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Файл нейронки (200 МБ) лежит в отдельном релизе, программы качают его оттуда
      # один раз. Кладём его туда при первой сборке, дальше шаг пропускается.
      - name: Выложить файл нейронки, если его ещё нет
        shell: bash
        run: |
          if ! gh release view models-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            curl -fL --retry 3 -o lama_fp32.onnx \
              https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
            gh release create models-v1 lama_fp32.onnx \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Файл нейронки" \
              --notes "Модель LaMa для ретуши. Не удалять: её скачивают установленные программы."
            rm lama_fp32.onnx
          fi

      # Модель помощника (2 ГБ) тоже кладём в свой релиз, разрезав на две части:
      # GitHub не берёт файлы больше 2 ГБ. Программа сначала качает с Hugging Face.
      - name: Выложить модель помощника, если её ещё нет
        shell: bash
        run: |
          if ! gh release view models-llm-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            F=qwen2.5-3b-instruct-q4_k_m.gguf
            curl -fL --retry 3 -o "$F" "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/$F"
            head -c 1100000000 "$F" > "$F.part1"
            tail -c +1100000001 "$F" > "$F.part2"
            gh release create models-llm-v1 "$F.part1" "$F.part2" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Модель помощника" \
              --notes "Qwen2.5 3B для помощника по программе. Не удалять: её скачивают установленные программы."
            rm -f "$F" "$F.part1" "$F.part2"
          fi

      - name: Установить зависимости
        if: steps.ver.outputs.exists == 'false'
        run: npm ci

      # Движок помощника: готовая сборка llama.cpp с поддержкой видеокарт (Vulkan),
      # без видеокарты сама работает на процессоре. Кладётся рядом с программой.
      - name: Скачать движок помощника
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          # «последний» релиз у llama.cpp бывает служебным, без сборок: ищем свежий со сборкой
          A=""
          for T in $(gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName -q '.[].tagName'); do
            gh release view "$T" --repo ggml-org/llama.cpp --json assets -q '.assets[].name' > assets.txt
            # сборка с Vulkan под 64-битную винду, если нет — обычная для процессора
            A=$(grep -iE '(win|windows).*vulkan.*(x64|amd64).*\.(zip|tar\.gz)$' assets.txt | head -1 || true)
            [ -n "$A" ] || A=$(grep -iE '(win|windows).*(cpu|avx2).*(x64|amd64).*\.(zip|tar\.gz)$' assets.txt | head -1 || true)
            [ -n "$A" ] && break
          done
          [ -n "$A" ] || { echo "сборка llama.cpp не найдена"; exit 1; }
          echo "беру $T $A"
          gh release download "$T" --repo ggml-org/llama.cpp -p "$A" -O "llama-pkg"
          mkdir -p tmp-llama vendor/llama
          case "$A" in *.zip) unzip -q llama-pkg -d tmp-llama ;; *) tar xzf llama-pkg -C tmp-llama ;; esac
          cp -r "$(dirname "$(find tmp-llama -name llama-server.exe | head -1)")"/. vendor/llama/
          ls vendor/llama

      - name: Токен бота обратной связи
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        env:
          TG: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          mkdir -p build-res
          node -e "require('fs').writeFileSync('build-res/feedback.json', JSON.stringify({ token: process.env.TG || '' }))"
          [ -n "$TG" ] && echo "токен есть" || echo "секрета TG_BOT_TOKEN нет: обратная связь будет копиться в очереди"

      - name: Собрать установщик
        if: steps.ver.outputs.exists == 'false'
        run: npx electron-builder --win --publish never

      # Релиз создаём сами: тег ставится на тот коммит, из которого собрано.
      # latest.yml нужен установленным копиям, чтобы увидеть новую версию.
      - name: Опубликовать релиз
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v$V" \
            "dist/EyePhoto-Setup-$V.exe" \
            "dist/EyePhoto-Setup-$V.exe.blockmap" \
            dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EyePhoto $V" \
            --notes "Версия $V"

  # Версия для мака (Apple Silicon), для проверки. Без платной подписи Apple,
  # поэтому обновляется вручную: программа сама сообщает о новой версии.
  mac:
    needs: build
    if: needs.build.outputs.created == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать движок помощника
        run: |
          A=""
          for T in $(gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName -q '.[].tagName'); do
            gh release view "$T" --repo ggml-org/llama.cpp --json assets -q '.assets[].name' > assets.txt
            A=$(grep -iE '(mac|macos|darwin).*arm64.*\.(zip|tar\.gz)$' assets.txt | grep -viE 'xcframework|ios' | head -1 || true)
            [ -n "$A" ] && break
          done
          [ -n "$A" ] || { echo "сборка llama.cpp не найдена"; exit 1; }
          echo "беру $T $A"
          gh release download "$T" --repo ggml-org/llama.cpp -p "$A" -O "llama-pkg"
          mkdir -p tmp-llama vendor/llama
          case "$A" in *.zip) unzip -q llama-pkg -d tmp-llama ;; *) tar xzf llama-pkg -C tmp-llama ;; esac
          cp -R "$(dirname "$(find tmp-llama -name llama-server -type f | head -1)")"/. vendor/llama/
          ls vendor/llama

      - name: Токен бота обратной связи
        shell: bash
        env:
          TG: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          mkdir -p build-res
          node -e "require('fs').writeFileSync('build-res/feedback.json', JSON.stringify({ token: process.env.TG || '' }))"
          [ -n "$TG" ] && echo "токен есть" || echo "секрета TG_BOT_TOKEN нет: обратная связь будет копиться в очереди"

      - name: Собрать под мак
        run: npx electron-builder --mac --publish never

      - name: Добавить в релиз
        run: |
          V="${{ needs.build.outputs.version }}"
          gh release upload "v$V" dist/EyePhoto-$V-mac.dmg dist/EyePhoto-$V-mac.zip dist/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
