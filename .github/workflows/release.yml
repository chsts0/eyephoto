name: release

# Сборка установщика под Windows и публикация релиза.
# Срабатывает на каждый пуш в main, но собирает только если версии
# из package.json ещё нет в релизах. То есть обновление для всех компов =
# поднять version в package.json и влить в main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, вышла ли уже эта версия
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Файл нейронки (200 МБ) лежит в отдельном релизе, программы качают его оттуда
      # один раз. Кладём его туда при первой сборке, дальше шаг пропускается.
      - name: Выложить файл нейронки, если его ещё нет
        shell: bash
        run: |
          if ! gh release view models-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            curl -fL --retry 3 -o lama_fp32.onnx \
              https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
            gh release create models-v1 lama_fp32.onnx \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Файл нейронки" \
              --notes "Модель LaMa для ретуши. Не удалять: её скачивают установленные программы."
            rm lama_fp32.onnx
          fi

      - name: Установить зависимости
        if: steps.ver.outputs.exists == 'false'
        run: npm ci

      - name: Собрать установщик
        if: steps.ver.outputs.exists == 'false'
        run: npx electron-builder --win --publish never

      # Релиз создаём сами: тег ставится на тот коммит, из которого собрано.
      # latest.yml нужен установленным копиям, чтобы увидеть новую версию.
      - name: Опубликовать релиз
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v$V" \
            "dist/EyePhoto-Setup-$V.exe" \
            "dist/EyePhoto-Setup-$V.exe.blockmap" \
            dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EyePhoto $V" \
            --notes "Версия $V"
