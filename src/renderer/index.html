<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'">
  <title>EyePhoto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-doc">
  <header class="menubar">
    <div class="logo"><i></i>EyePhoto</div>
    <nav id="menus" class="menus"></nav>
    <div class="menubar-right">
      <button class="btn" id="developBtn" title="Цвет, свет и резкость выбранного слоя (Ctrl+Shift+A)">Проявка</button>
      <button class="btn" id="placeBtn" title="Положить снимок слоем в открытый документ (Ctrl+Shift+O)">Поместить снимок</button>
      <button class="btn primary" id="saveBtn" title="Сохранить JPEG с номером в папку дня (Ctrl+S)">Сохранить</button>
    </div>
  </header>

  <div class="optbar" id="optbar"></div>

  <nav class="tools" id="tools" aria-label="Инструменты"></nav>

  <section class="center">
    <div class="tabs" id="tabs"></div>
    <main class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>
      <div class="ctxbar" id="ctxbar" hidden>

      </div>
      <div class="hint" id="docHint" hidden>
        <b>Здесь пока нет снимка</b>
        <span>Перетащите сюда файл с камеры или нажмите «Поместить снимок».</span>
      </div>
      <div class="toast" id="toast" hidden></div>
      <div class="busy" id="busy" hidden><div class="busy-box"><span class="spinner"></span><span id="busyText"></span></div></div>

      <div class="home" id="home">
        <div class="home-inner">
          <button class="home-close" id="homeClose" title="Закрыть" hidden></button>
          <h1>Новый документ</h1>
          <h2>Чистый лист</h2>
          <div class="cards" id="sheetCards"></div>
          <div class="home-head">
            <h2>Шаблоны студии</h2>
            <button class="text-btn" id="tplFolder"></button>
          </div>
          <div class="cards" id="tplCards"></div>
          <p class="home-empty" id="tplEmpty" hidden></p>
          <div class="home-foot">
            <button class="btn" id="homeOpen"></button>
            <span>Можно просто перетащить снимок или PSD в окно.</span>
          </div>
        </div>
      </div>
    </main>
  </section>

  <aside class="dock">
    <section class="panel" id="pupilPanel">
      <header><h3>Зрачок</h3></header>
      <div class="panel-body" id="pupilBody"></div>
    </section>

    <section class="panel" id="actionsPanel">
      <header><h3>Раскладка</h3></header>
      <div class="panel-body actions" id="actions"></div>
    </section>

    <section class="panel grow">
      <header class="panel-tabs">
        <button class="on" data-tab="layers">Слои</button>
        <button data-tab="history">История</button>
      </header>
      <div class="layer-head" id="layerHead"></div>
      <div class="list" id="layers"></div>
      <div class="list" id="history" hidden></div>
      <footer class="layer-foot" id="layerFoot"></footer>
    </section>
  </aside>

  <footer class="status">
    <span id="stZoom"></span>
    <span id="stDoc"></span>
    <span id="stHint"></span>
    <span class="status-right">
      <span class="dot" id="updateDot"></span>
      <span id="updateText"></span>
      <button class="text-btn" id="updateAction" hidden></button>
      <span class="version" id="version"></span>
    </span>
  </footer>

  <div class="dev" id="dev" hidden>
    <div class="dev-view" id="devView">
      <canvas id="devCanvas"></canvas>
      <div class="dev-tools">
        <div class="seg" id="devZoom"><button data-z="fit">Целиком</button><button data-z="one">100%</button></div>
        <label class="check"><input type="checkbox" id="devBefore">Без обработки</label>
      </div>
    </div>
    <aside class="dev-side">
      <header><h3>Проявка</h3><span id="devName"></span></header>
      <div class="dev-body" id="devBody"></div>
      <footer>
        <div class="dev-links">
          <button class="text-btn" id="devReset" title="Вернуть настройки, с которыми открываются новые снимки">Вернуть стандарт</button>
          <button class="text-btn" id="devStd" title="Новые снимки будут открываться с этими настройками">Сделать стандартом</button>
        </div>
        <div class="dev-actions">
          <button class="btn" id="devCancel">Отмена</button>
          <button class="btn primary" id="devOk">Готово</button>
        </div>
      </footer>
    </aside>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="modal-field" id="modalField" hidden>
        <div class="field"><b id="modalPrefix"></b><input id="modalInput" autocomplete="off" spellcheck="false"></div>
        <span id="modalNote"></span>
      </div>
      <p class="modal-error" id="modalError"></p>
      <div class="progress" id="modalProgress" hidden><i></i></div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel"></button>
        <button class="btn primary" id="modalOk"></button>
      </div>
    </div>
  </div>

  <script src="/agpsd/bundle.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
